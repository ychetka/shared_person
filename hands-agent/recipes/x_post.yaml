# MIGRATION NOTICE (issue #127, CDP read-only directive): this recipe
# still contains dom_find/click_dom/js_click/dom_text steps. Those
# actions ran on Runtime.evaluate, which is now BANNED - the engine
# fails them closed with a named error, so this recipe CANNOT run
# until it is migrated to the OS-only split: locate (screenshot ->
# coords) + click, open_tab_bg for tab control, tab_url for the
# location read-back. See docs/cdp-write-audit.md.
#
# X (Twitter) post recipe - human-send variant C.
#
# Variant C (approved): the hands-agent fills the composer AND clicks
# Post itself - no manual confirmation click. The developer accepts the
# X ToS risk of automated posting on his own account. The FIRST run is
# supervised only, after an explicit developer START approval
# (msg_427 / msg_422); unsupervised queue use comes later.
#
# Params: text (required), publish_label (required - the dialog
# publish button's exact label: "Post" for a single post, "Post all"
# when text2 is set; see the anatomy note), [image_path],
# [text2 = thread second post]
#
# Preconditions:
# - Audit Chrome profile (CDP :9223) with an x.com/home tab logged in
#   as @varenicX, EN UI. Composer anatomy verified live 2026-11-09:
#   - Left-nav Post button = [data-testid=SideNav_NewTweet_Button],
#     aria-label + text "Post". With no dialog open it is the ONLY
#     exact-'Post' element on the page, so click_dom "Post" hits it.
#     BRITTLE (informational): that uniqueness is a layout
#     coincidence, not a contract - if X adds another exact-'Post'
#     element to /home (upsell, pill button), dom_rect's
#     smallest-exact-match can silently pick the wrong one. The
#     x_0b_dialog.png shot is the tripwire: confirm a [role=dialog]
#     composer actually opened before trusting the run.
#   - Dialog [role=dialog]: contenteditable tweetTextarea_0
#     (aria-label "Post text", autofocus), media button aria-label
#     "Add photos or video" -> hidden fileInput -> GTK file chooser
#     (ctrl+l -> absolute path -> Return, same pattern as
#     linkedin_post.yaml), publish button = [data-testid=tweetButton].
#     SINGLE-POST mode: its label is "Post" - smaller than the nav
#     Post, so dom_rect's smallest-exact-match inside the dialog
#     resolves to tweetButton. THREAD mode (text2 set): the label
#     becomes "Post all" - "Post" then exact-matches ONLY the nav
#     button behind the modal, so an unconditional click_dom "Post"
#     returns ok:true with nothing published (silent false-success).
#     Hence publish_label is a caller-supplied param, not a literal.
#   - The inline timeline composer (tweetTextarea_0) also exists on
#     /home without the dialog; the recipe still opens the dialog via
#     nav Post for a deterministic compose surface.
# - url: fields use "x.com/home", not bare "x.com": the substring
#   tab match must not land on a console.x.com/developer portal tab.
#
# Abort guidance (no silent wrong clicks):
# - Sign-in wall / CAPTCHA / phone-verification prompt -> ABORT and
#   escalate to the operator (recipe never logs in, never solves
#   CAPTCHAs, never touches verification codes).
# - Any unexpected dialog/overlay -> shot + abort; do not improvise.
name: x_post
steps:
  - action: shot
    name: x_0_start.png
  # Nav Post button = the only exact-'Post' element pre-dialog (see
  # the header brittleness note).
  - action: click_dom
    url: x.com/home
    target: "Post"
  - action: wait
    seconds: 3
  # Dialog-open audit: proves the [role=dialog] composer received
  # focus (vs the inline composer, or a wrong click landing
  # elsewhere) before any typing happens.
  - action: shot
    name: x_0b_dialog.png
  # Ensure focus inside tweetTextarea_0 (aria-label "Post text");
  # harmless if the dialog already autofocused it.
  - action: click_dom
    url: x.com/home
    target: "Post text"
  - action: type
    text: "{text}"
  - action: wait
    seconds: 1
  - action: shot
    name: x_1_typed.png
  # optional image attach (skipped when image_path param is empty)
  - action: click_dom
    url: x.com/home
    target: "Add photos or video"
    if: "{image_path}"
  - action: wait
    seconds: 3
    if: "{image_path}"
  # GTK file chooser: ctrl+l -> absolute path -> Return.
  - action: key
    keys: ctrl+l
    if: "{image_path}"
  - action: type
    text: "{image_path}"
    if: "{image_path}"
  - action: key
    keys: Return
    if: "{image_path}"
  - action: wait
    seconds: 4
    if: "{image_path}"
  - action: shot
    name: x_2_media.png
    if: "{image_path}"
  # optional thread second post (skipped when text2 param is empty).
  # UNVERIFIED: the add-post "+" button is expected at
  # data-testid=addButton after text is typed; "Add post" is a guess
  # for its aria-label - verify the exact target text on the first
  # supervised run before relying on this branch.
  - action: click_dom
    url: x.com/home
    target: "Add post"
    if: "{text2}"
  - action: wait
    seconds: 2
    if: "{text2}"
  - action: type
    text: "{text2}"
    if: "{text2}"
  - action: shot
    name: x_3_thread.png
    if: "{text2}"
  # Dialog publish button = [data-testid=tweetButton]. The caller
  # passes publish_label to disambiguate: "Post" for a single post
  # (smallest exact-'Post' match inside the open dialog beats the
  # larger nav Post), "Post all" when text2 is set (the button label
  # changes, and "Post" would exact-match ONLY the nav button behind
  # the modal -> ok:true, nothing published).
  - action: click_dom
    url: x.com/home
    target: "{publish_label}"
  - action: wait
    seconds: 6
  - action: shot
    name: x_4_done.png
