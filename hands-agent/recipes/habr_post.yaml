name: habr_post
# Habr publish recipe (docs/habr-driver-spec.md): drives the logged-in
# desktop browser profile through the Habr composer - title, hubs,
# markdown body with <habracut>, optional КДПВ image and inline
# figures - and completes it INCLUDING the final publish click. No
# write API exists; this recipe IS the whole external layer.
#
# CDP READ-ONLY DIRECTIVE (issue #127): no Runtime.evaluate, no
# Target.*, no DOM-driven steps anywhere in this recipe. Tab control
# is OS-level (open_tab_bg: ctrl+t -> type URL -> Enter ->
# ctrl+shift+tab back so the SPA initializes occluded -> settle ->
# title-verified activate -
# the live-verified workaround for the Habr renderer wedging on a
# FOREGROUND init). Element targeting is screenshot-driven: `locate`
# (vision model over the current screen) answers coords, `click` hits
# them with real OS input. locate REQUIRES GEMINI_API_KEY on the
# worker - without it every locate step fails closed and the run
# aborts before touching the page.
#
# Params (from the sp-publish driver's queue payload):
#   kind        - 'article' (default) or 'post'
#   post_kind   - true for kind=post (gates the short-form URL block)
#   title       - article title (empty for kind=post)
#   hubs        - hub list (1-5)
#   text_md     - markdown body, carries the literal <habracut> marker
#   tags        - optional tag list
#   image_path  - optional КДПВ (host path - already translated)
#   media       - optional inline figures (host paths)
#   test        - retract-after-publish flag. NOTE: per the issue #58
#                 directive update, live test:true/test posts are
#                 banned - media verification happens via metrics on
#                 REAL posts. The retract block stays for operator
#                 drill runs only.
#
# Result: {ok, url, retracted?, media_attached?, abort_reason?,
# last_step, publish_step} - url comes from the post-publish /json
# tab-listing read-back (tab_url -> emit page url), which IS the
# verification the driver records.
#
# CLICK BOUNDARY: the publish click carries `marks: publish` -
# the worker records its index as publish_step next to last_step
# (index of the last completed step) in EVERY result. The driver
# classifies last_step >= publish_step as a post-click crash
# (maybe_live + orphan probe) and anything earlier as a definite
# pre-click failure. Do not move or rename the mark.
#
# BLOCKED SURFACES: the optional locate probes right after the
# composer load look for CAPTCHA/verification and login-wall surfaces
# on the screenshot; the sandbox-tier redirect is a LOCATION fact read
# from the tab listing (tab_url). A hit emits abort_reason and the
# gated `fail` step aborts the run - emits survive into the failed
# result for operator_escalation evidence.
#
# HONEST STATUS: rewritten for the OS-only actuation split; the locate
# descriptions follow Habr's current RU UI but the recipe has NOT been
# run against a live profile end-to-end. Known gaps are marked GAP
# inline: anything the screenshot path cannot express today aborts
# loudly instead of falling back to a banned call.
steps:
  # ---------- open the composer (background-load, OS-only) ----------
  # article: /ru/articles/new/ gated on {title}; post short form:
  # /ru/posts/new/ gated on {post_kind}. settle 60s: the composer SPA
  # must initialize while the tab is occluded.
  - action: shot
    name: habr_0_start.png
  - action: open_tab_bg
    url: "https://habr.com/ru/articles/new/"
    settle: 60
    if: "{title}"
  - action: open_tab_bg
    url: "https://habr.com/ru/posts/new/"
    settle: 60
    if: "{post_kind}"
  - action: wait
    seconds: 6
  - action: shot
    name: habr_1_composer.png
  # ---------- blocked-surface probes ----------
  # CAPTCHA/verification and login walls are screenshot facts now:
  # optional locate probes describe the surface; a hit sets
  # <into>_hit and the emit+fail pair aborts on a named reason.
  - action: locate
    target: "a CAPTCHA or human-verification wall covering the page"
    hint: "checkbox/iframe blocking the composer"
    into: blk_captcha
    optional: true
  - action: emit
    key: abort_reason
    value: "CAPTCHA/verification surface visible"
    if: "{blk_captcha_hit}"
  - action: locate
    target: "a login wall or sign-in prompt blocking the composer (RU 'Log in' label)"
    hint: "auth modal instead of the editor"
    into: blk_login
    optional: true
  - action: emit
    key: abort_reason
    value: "logged-out/login wall visible"
    if: "{blk_login_hit}"
  # the sandbox redirect is a LOCATION fact, not a text marker:
  # the /json tab listing answers it without touching the page
  - action: tab_url
    url: "habr.com/ru/sandbox"
    id: "{tab_id}"
    into: blk_sandbox
    optional: true
  - action: emit
    key: abort_reason
    value: "sandbox-tier surface (ReadOnly account): {blk_sandbox}"
    if: "{blk_sandbox}"
  - action: fail
    reason: "blocked publish surface - operator needed (see abort_reason)"
    if: "{blk_captcha_hit}{blk_login_hit}{blk_sandbox}"
  # ---------- title (article only) ----------
  - action: locate
    target: "the title input field (RU placeholder 'Title')"
    hint: "wide field at the top of the composer"
    if: "{title}"
  - action: click
    if: "{title}"
  - action: set_clipboard
    text: "{title}"
    if: "{title}"
  - action: key
    keys: "ctrl+v"
    if: "{title}"
  # ---------- hubs ----------
  # The hub selector is a tag input with an autocomplete popup. Per the
  # directive the suggestion is CLICKED by coordinates - never
  # paste+Enter, which accepted the raw text instead of the resolved
  # hub (the hubs autocomplete gap). {hubs} arrives as a JSON list and
  # is entered ONE HUB PER ITERATION (for_each): typing a Python-repr
  # list ('['a', 'b']') resolved garbage, so each element is typed into
  # the field, the autocomplete popup is located, and its first
  # suggestion clicked - fail closed when no suggestion resolves.
  - action: locate
    target: "the hubs input field (RU label 'Hubs')"
    hint: "tag-style input below the title"
  - action: click
  - action: for_each
    items: hubs
    as: hub
    steps:
      - action: type
        text: "{hub}"
      - action: wait
        seconds: 2
      - action: locate
        target: "the first item in the autocomplete suggestion popup under the hubs input"
        hint: "dropdown list item matching the typed hub name '{hub}'"
        into: sug
        optional: true
      - action: click
        pos: sug
        if: "{sug_hit}"
      # no suggestion resolved -> fail closed (negated if: runs when
      # sug_hit is empty); the banned Enter-fallback would submit raw
      # text
      - action: fail
        reason: "hubs autocomplete produced no clickable suggestion for '{hub}' - refusing Enter fallback"
        if: "!{sug_hit}"
      - action: wait
        seconds: 1
  # ---------- body ----------
  # markdown mode: long bodies go through the clipboard, never
  # type_text (human-speed typing a 10k article blows the result
  # window)
  - action: locate
    target: "the main body editor area (RU label 'Publication text')"
    hint: "large editor surface below the hubs field"
  - action: click
  - action: set_clipboard
    text: "{text_md}"
  - action: key
    keys: "ctrl+v"
  - action: wait
    seconds: 2
  - action: shot
    name: habr_2_filled.png
  # ---------- КДПВ / media (optional, TODO: verified attach) ----------
  # image_path attaches through the composer's file-chooser dialog:
  # click the upload control, ctrl+l, paste the HOST path, Return.
  - action: locate
    target: "the image upload control (RU label 'Upload')"
    hint: "upload button in the composer toolbar"
    if: "{image_path}"
  - action: click
    if: "{image_path}"
  - action: wait
    seconds: 2
    if: "{image_path}"
  - action: key
    keys: "ctrl+l"
    if: "{image_path}"
  - action: set_clipboard
    text: "{image_path}"
    if: "{image_path}"
  - action: key
    keys: "ctrl+v"
    if: "{image_path}"
  - action: key
    keys: "Return"
    if: "{image_path}"
  - action: wait
    seconds: 4
    if: "{image_path}"
  # honest attach count for the ledger: reaching this emit means every
  # gated attach step above completed (any failure returns before it).
  # Only image_path attaches today - the inline media[] figures are a
  # verified-run TODO, so the count is 1, not len(media)+1. The driver
  # records result.media_attached (absent -> 0), never its own guess.
  - action: emit
    key: media_attached
    value: 1
    if: "{image_path}"
  # ---------- PUBLISH CLICK (the boundary) ----------
  - action: locate
    target: "the green publish button (RU label 'Publish')"
    hint: "primary action button, usually bottom-right of the composer"
  - action: click
    marks: publish
  - action: wait
    seconds: 8
  - action: shot
    name: habr_3_published.png
  # ---------- URL read-back (the verification) ----------
  # /json tab listing -> OUR tab's url/title, bound by the target id
  # the open_tab_bg step recorded - a bare 'habr.com' substring could
  # read back a DIFFERENT Habr tab and publish a false external_id.
  # No page is touched.
  - action: tab_url
    id: "{tab_id}"
    url: "habr.com"
    into: page
  - action: emit
    key: url
    value: "{page}"
  # ---------- test retract (optional, drill runs only) ----------
  # 'unpublish' on Habr = the article's edit menu 'В черновики'
  # (back to drafts). Emit retracted so the driver records
  # test-published-retracted vs test-retract-failed.
  - action: locate
    target: "the back-to-drafts menu item or button (RU label)"
    hint: "article edit menu on the published page"
    if: "{test}"
  - action: click
    if: "{test}"
  - action: wait
    seconds: 5
    if: "{test}"
  - action: emit
    key: retracted
    value: true
    if: "{test}"
