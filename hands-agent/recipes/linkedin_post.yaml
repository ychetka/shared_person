# LinkedIn personal-profile post recipe.
# Verified end-to-end 2025-10-23 (DISPLAY :1, 1400x1050): real published
# post with text + image on a personal profile.
#
# DOM-read for targeting, real OS input for actions.
# Params: text, [image_path]
#
# Notes from the verified run (RU UI):
# - click_dom "Новая публикация" opens the compose modal; the editor
#   autofocuses - type directly.
# - An info banner ("Коллективные публикации...") may appear above the
#   editor; it does not block typing or the "Разместить" button.
# - Media button aria-label = "Медиаресурсы" -> GTK file chooser ->
#   ctrl+l -> absolute path -> Return -> editor modal -> "Далее".
# - Publish button = "Разместить" (exact-match dom_rect avoids hitting
#   "Разместить для всех" in the header row).
# - Post-publish a Premium upsell modal can appear ("Не сейчас" closes it).
# EN UI equivalents: "Start a post", "Add media", "Next", "Post".
name: linkedin_post
steps:
  - action: shot
    name: li_0_start.png
  - action: click_dom
    url: linkedin.com
    target: "Новая публикация"
  - action: wait
    seconds: 3
  - action: type
    text: "{text}"
  - action: wait
    seconds: 1
  - action: shot
    name: li_1_typed.png
  # optional image attach (skipped when image_path param is empty)
  - action: click_dom
    url: linkedin.com
    target: "Медиаресурсы"
    if: "{image_path}"
  - action: wait
    seconds: 3
    if: "{image_path}"
  - action: key
    keys: ctrl+l
    if: "{image_path}"
  - action: type
    text: "{image_path}"
    if: "{image_path}"
  - action: key
    keys: Return
    if: "{image_path}"
  - action: wait
    seconds: 4
    if: "{image_path}"
  # LI image editor modal: "Далее" confirms and returns to the composer
  - action: click_dom
    url: linkedin.com
    target: "Далее"
    if: "{image_path}"
  - action: wait
    seconds: 3
    if: "{image_path}"
  - action: shot
    name: li_2_ready.png
  - action: click_dom
    url: linkedin.com
    target: "Разместить"
  - action: wait
    seconds: 5
  - action: shot
    name: li_3_done.png
