# Facebook personal-profile post recipe.
# DOM-read for targeting (getBoundingClientRect -> screen coords),
# real OS input for all actions. Params: text, [image_path]
name: facebook_post
steps:
  - action: click_dom
    url: facebook.com
    target: "нового?"
  - action: wait
    seconds: 2
  - action: type
    text: "{text}"
  - action: wait
    seconds: 1
  - action: shot
    name: fb_ready.png
  - action: click_dom
    url: facebook.com
    target: "Опубликовать"
  - action: wait
    seconds: 3
  - action: shot
    name: fb_done.png
