# shared-person stack - self-contained, does not touch other projects.
# Services run on the local rootless docker (single-uid userns):
# images must be flattened imports (see n8n-local / docs/deploy.md).
# Build steps (npm install, tsc) run on the HOST - containers only COPY
# prebuilt artifacts, so no network is needed inside `docker build`.
#
# Operational caveat: the ${VAR:?} guards below are evaluated for EVERY
# compose subcommand, not just `up` - `down`, `stop`, `ps`, `logs`,
# `exec` all fail in a shell without the vars. Keep `--env-file ../ENV`
# on every `docker compose` call. If ../ENV is unavailable and the
# stack must be stopped, `docker stop <container>` works directly
# (container_name is pinned for every service).

name: shared-person

volumes:
  n8n_storage:
  rss_state:
  edge_data:

services:
  n8n:
    image: n8n-local:latest
    container_name: shared-person-n8n
    restart: always
    network_mode: host
    user: "0"
    security_opt:
      - apparmor=unconfined
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5780
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RUNNERS_ENABLED=true
      # Default broker port 5679 is taken by the crypto-bot instance.
      - N8N_RUNNERS_BROKER_PORT=5781
      # Code-node task budget: the content-gen chain (extract > write >
      # slop > critic > media-selector) can take ~10 min when models run
      # through fallback cascades; the default 300s kills it mid-flight.
      - N8N_RUNNERS_TASK_TIMEOUT=900
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      # Code nodes read secrets via $env (TG token, platform API keys)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      # Webhooks published at https://shared-person.opticode.su (edge proxy).
      - WEBHOOK_URL=https://shared-person.opticode.su:8443/
      # required like the webhook secrets below: every Code node TG
      # call reads this via $env, and an empty value only surfaces as
      # silent 404s from api.telegram.org at runtime - ${VAR:?} fails
      # `docker compose up` loudly instead
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?required - set in ../ENV}
      # Telegram webhook authenticity: setWebhook registers this as
      # secret_token; Telegram then signs every delivery with the
      # X-Telegram-Bot-Api-Secret-Token header, which sp-tg-moderation
      # verifies before touching any update (tools/tg_webhook_setup.sh
      # re-registers the webhook). Required - ${VAR:?} makes an unset
      # secret fail `docker compose up` loudly instead of injecting an
      # empty value that leaves the gate closed at runtime (a dead
      # pipeline that still looks deployed). The runtime fail-closed
      # check stays as the second layer.
      - TG_WEBHOOK_SECRET=${TG_WEBHOOK_SECRET:?TG_WEBHOOK_SECRET is required - set it in the compose environment}
      # operator chat is pinned config, not learned from updates - a
      # forged message used to rewrite state/tg.json and hijack every
      # preview. tg.json (written by sp-tg-setup) stays as fallback.
      # Intentionally NOT ${VAR:?}: the setup flow resolves the chat id
      # into tg.json on first run, so compose must still start without
      # it - but with NEITHER set the OPERATOR_CHAT gate drops every
      # update silently (see README).
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # moderation-draft webhook shared secret: the public draft
      # endpoint requires an X-Shared-Token or X-TG-Draft-Secret header
      # matching this (fails closed when unset); the content-gen
      # workflow sends it on its internal draft dispatch. Required for
      # draft delivery - generate with `openssl rand -hex 32`.
      # ${VAR:?} like TG_WEBHOOK_SECRET: fail at compose-up time, not
      # silently at runtime.
      - DRAFT_WEBHOOK_SECRET=${DRAFT_WEBHOOK_SECRET:?DRAFT_WEBHOOK_SECRET is required - set it in the compose environment}
      # content-gen webhook shared secret: this endpoint is public via
      # the edge proxy too, and a forged POST makes the workflow itself
      # dispatch attacker text to moderation-draft with the valid
      # DRAFT_WEBHOOK_SECRET - a live Approve button in the operator
      # chat plus free LLM spend. Requires an X-Content-Gen-Secret
      # header matching this (fails closed when unset); the internal
      # callers in sp-tg-moderation (post N, edit rewrite) send it.
      # Required for generation - generate with `openssl rand -hex 32`.
      # ${VAR:?} like TG_WEBHOOK_SECRET: fail at compose-up time, not
      # silently at runtime.
      - CONTENT_GEN_WEBHOOK_SECRET=${CONTENT_GEN_WEBHOOK_SECRET:?CONTENT_GEN_WEBHOOK_SECRET is required - set it in the compose environment}
      # enabled publish platforms, comma-separated - single source for
      # the ENABLED gates in sp-publish (Publish Tick) and
      # sp-tg-moderation (Handle TG Update); both read $env via
      # PUBLISH_PLATFORMS so the two cannot drift. 'all' is valid and
      # expands to every writer platform (linkedin/facebook/fb/vk),
      # matching content-gen's MAP.all fan-out. Default keeps VK
      # only; non-enabled platforms land in queue skipped/
      - PUBLISH_PLATFORMS=${PUBLISH_PLATFORMS:-vk}
      # rewrite-overwrite window (ms) - single source for the two
      # REWRITE_WINDOW_MS readers in sp-tg-moderation: Prepare Draft
      # (how long a 'rewrite' draft may be overwritten through the
      # public webhook) and Handle TG Update (how long Approve
      # refuses while a rewrite is in flight). Both Code nodes fall
      # back to 900000 (15min) when this is unset/empty.
      - REWRITE_WINDOW_MS=${REWRITE_WINDOW_MS:-}
      # platform tokens for the publish workflow (optional - VK can run
      # on the refresh-service token; non-VK platforms go to skipped/)
      - VK_ACCESS_TOKEN=${VK_ACCESS_TOKEN:-}
      - VK_USER_ID=${VK_USER_ID:-}
      # host-side token refresh service (tools/vk_token_service.py):
      # the URL override only works if it is passed through here, and
      # /vk-token requires the shared-secret header
      - VK_TOKEN_REFRESH_URL=${VK_TOKEN_REFRESH_URL:-}
      # required like the webhook secrets above: ${VAR:?} fails
      # compose up loudly instead of injecting an empty value that
      # leaves the /vk-token gate closed at runtime
      - VK_TOKEN_SECRET=${VK_TOKEN_SECRET:?VK_TOKEN_SECRET is required - set it in the compose environment}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-}
      - LINKEDIN_PERSON_URN=${LINKEDIN_PERSON_URN:-}
    volumes:
      - n8n_storage:/home/node/.n8n
      # hands-agent task queue (n8n drops publish tasks into inbox/)
      - ./hands-agent/queue:/home/node/hands-queue
      # media candidates for moderation sendPhoto (brief media[] paths
      # resolve here: <host>/materials/... -> /home/node/materials/...)
      - ../materials:/home/node/materials:ro

  llm-gateway:
    image: shared-person/llm-gateway:latest
    build:
      context: ./llm-gateway
    container_name: shared-person-llm-gateway
    restart: always
    network_mode: host
    user: "0"
    security_opt:
      - apparmor=unconfined
    environment:
      - LLM_GATEWAY_PORT=8787
      # required for the LLM pipeline (llm-gateway /run and /image both
      # call Gemini): ${VAR:?} fails `docker compose up` loudly instead
      # of injecting an empty key that only surfaces as silent LLM
      # failures at runtime
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY is required - set it in the compose environment}
      - ROLES_DIR=/app/code/roles
      - PROMPTS_DIR=/app/code/prompts
      - CONTEXT_DIR=/app/code/context
      # POST /image writes generated PNGs here (host materials/img),
      # n8n moderation sendPhotos them via its read-only mount.
      - IMAGE_DIR=/app/materials/img
      - IMAGE_MODELS=${IMAGE_MODELS:-gemini-3.1-flash-image-preview,gemini-2.5-flash-image}
    volumes:
      - ./:/app/code:ro
      - ../materials/img:/app/materials/img

  edge:
    image: n8n-local:latest
    container_name: shared-person-edge
    restart: always
    network_mode: host
    user: "0"
    security_opt:
      - apparmor=unconfined
    environment:
      - XDG_DATA_HOME=/data
    entrypoint: ["/edge/caddy", "run", "--config", "/edge/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./edge:/edge:ro
      - edge_data:/data

  rss-reader:
    image: shared-person/rss-reader:latest
    build:
      context: ./rss-reader
    container_name: shared-person-rss-reader
    restart: always
    network_mode: host
    user: "0"
    security_opt:
      - apparmor=unconfined
    environment:
      - RSS_PORT=8788
      - LLM_GATEWAY_URL=http://127.0.0.1:8787
    volumes:
      - ./rss-reader/feeds.yaml:/app/feeds.yaml
      - rss_state:/app/state
