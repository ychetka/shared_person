name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job so the required check name stays exactly "unit-tests".
  # npm test in both services is a live smoke against a running server,
  # not a unit suite: it proves boot + endpoint reachability in CI
  # (llm-gateway /run returns a JSON error without GEMINI_API_KEY;
  # rss-reader digest runs against a localhost fixture feed so the
  # required check does not depend on external services).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            llm-gateway/package-lock.json
            rss-reader/package-lock.json

      - name: Smoke llm-gateway
        working-directory: llm-gateway
        run: |
          npm ci
          npm run build
          node dist/server.js &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/health
          GATEWAY=http://localhost:8787 npm test
          curl -sf http://localhost:8787/roles | grep -q extract-facts

      - name: Smoke rss-reader
        working-directory: rss-reader
        run: |
          npm ci
          npm run build
          cat > /tmp/feed.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"><channel>
            <title>CI fixture</title><link>http://localhost/</link>
            <item><title>ci smoke item</title><link>http://localhost/1</link>
              <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')</pubDate></item>
          </channel></rss>
          XML
          cat > /tmp/feeds-ci.yaml <<'EOF'
          feeds:
            - name: CI fixture
              url: http://localhost:8899/feed.xml
              tags: [ci]
              weight: 0.9
          EOF
          node -e "require('node:http').createServer((q,s)=>{s.setHeader('Content-Type','application/rss+xml');s.end(require('node:fs').readFileSync('/tmp/feed.xml'))}).listen(8899)" &
          feed_server=$!
          FEEDS_FILE=/tmp/feeds-ci.yaml node dist/server.js &
          server=$!
          trap 'kill $server $feed_server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8788/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8788/health
          RSS=http://localhost:8788 npm test
          curl -sf "http://localhost:8788/digest?since=48h" | grep -q "ci smoke item"
