name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Ruff check
        run: uvx ruff@0.17.3 check .

      - name: Ruff format check
        run: uvx ruff@0.17.3 format --check .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            llm-gateway/package-lock.json
            rss-reader/package-lock.json

      - name: Biome CI
        run: npx -y @biomejs/biome@2.6.4 ci .

      - name: Typecheck llm-gateway
        working-directory: llm-gateway
        run: |
          npm ci
          npx tsc --noEmit

      - name: Typecheck rss-reader
        working-directory: rss-reader
        run: |
          npm ci
          npx tsc --noEmit

      - name: Check changes entry
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/check_changes_entry.sh --base "origin/$BASE_REF"
