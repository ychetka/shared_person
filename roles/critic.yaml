name: critic
description: Second-opinion review of drafts - positioning fit, slop check, fact accuracy
backend: gemini
model: gemini-3.5-flash
fallback_models:
  - gemini-3.6-flash
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
  - gemini-flash-lite-latest
temperature: 0.4
max_tokens: 4096
prompt: critic
context_slots:
  - writer_style
output:
  type: json
