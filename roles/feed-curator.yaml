name: feed-curator
description: Scores and selects digest items by relevance to author positioning (called by rss-reader)
backend: gemini
model: gemini-3.5-flash
fallback_models:
  - gemini-3.6-flash
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
  - gemini-flash-lite-latest
temperature: 0.2
max_tokens: 4096
prompt: feed-curator
context_slots:
  - client_context
output:
  type: json
